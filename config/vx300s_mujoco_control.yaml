# ros_control configuration for the VX300S arm under mujoco_ros_control.
#
# Reach task: only the 6-DOF arm is controlled. The Interbotix description's gripper is a
# prismatic `gripper` joint (the fingers mimic it) that has no counterpart in the MuJoCo model,
# so its transmission is stripped from robot_description by the multiros backend (the env passes
# controlled_joints; see multiros.utils.mujoco_models.filter_urdf_transmissions) and no gripper
# controller is spawned. The MJCF finger joints remain passive.
#
# The arm joints use EffortJointInterface transmissions (from the Interbotix xacro), so the
# trajectory controller is the effort variant; its per-joint `gains:` are the active PID
# (mujoco_ros_control/pid_gains only applies to position/velocity interfaces, not effort).

# Publishes /vx300s/joint_states from the simulated encoders.
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

# 6-DOF arm: effort JointTrajectoryController (torque output via per-joint PID).
arm_controller:
  type: effort_controllers/JointTrajectoryController
  joints:
    - waist
    - shoulder
    - elbow
    - forearm_roll
    - wrist_angle
    - wrist_rotate
  gains:
    waist:        {p: 100.0, i: 5.0,  d: 1.0}
    shoulder:     {p: 800.0, i: 10.0, d: 1.0}
    elbow:        {p: 500.0, i: 10.0, d: 1.0}
    forearm_roll: {p: 50.0,  i: 1.0,  d: 0.5}
    wrist_angle:  {p: 150.0, i: 3.0,  d: 1.0}
    wrist_rotate: {p: 100.0, i: 1.0,  d: 0.1}
  constraints:
    goal_time: 0.2
    waist:        {trajectory: 0.2, goal: 0.1}
    shoulder:     {trajectory: 0.2, goal: 0.2}
    elbow:        {trajectory: 0.2, goal: 0.2}
    forearm_roll: {trajectory: 0.2, goal: 0.2}
    wrist_angle:  {trajectory: 0.2, goal: 0.2}
    wrist_rotate: {trajectory: 0.2, goal: 0.2}

# Gripper controller (effort JointTrajectoryController on the two prismatic fingers). Only the
# pick-and-place task spawns this (its controllers_list includes "gripper_controller"); reach and
# push leave the fingers passive and never spawn it, so loading these params is harmless for them.
# The MJCF couples the fingers by an equality constraint (right_finger = -left_finger); the task env
# commands them consistently (right target = -left target) so the controller and constraint agree.
gripper_controller:
  type: effort_controllers/JointTrajectoryController
  joints:
    - left_finger
    - right_finger
  gains:
    left_finger:  {p: 100.0, i: 1.0, d: 1.0}
    right_finger: {p: 100.0, i: 1.0, d: 1.0}
  constraints:
    goal_time: 0.5
    left_finger:  {trajectory: 0.05, goal: 0.02}
    right_finger: {trajectory: 0.05, goal: 0.02}
