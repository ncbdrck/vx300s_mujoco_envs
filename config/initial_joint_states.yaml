# Home configuration applied by the mujoco_ros server on load and on every reset.
# Values are space-delimited strings (one entry per joint axis), as required by the
# server's loadInitialJointStates parser. The arm home of all-zeros matches the
# reach task's home pose; the gripper is left open.
initial_joint_positions:
  joint_map:
    waist: "0.0"
    shoulder: "0.0"
    elbow: "0.0"
    forearm_roll: "0.0"
    wrist_angle: "0.0"
    wrist_rotate: "0.0"
    left_finger: "0.057"
    right_finger: "-0.057"

initial_joint_velocities:
  joint_map:
    waist: "0.0"
    shoulder: "0.0"
    elbow: "0.0"
    forearm_roll: "0.0"
    wrist_angle: "0.0"
    wrist_rotate: "0.0"
    left_finger: "0.0"
    right_finger: "0.0"
